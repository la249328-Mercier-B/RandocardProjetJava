<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>partie Randocard</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<audio id="musique" src="../sounds/casinoLuigi.mp3" loop autoplay></audio>

<body>

<div class="player-info">
    Score : <span id="score">0</span>
</div>

<div class="volume-control">
    🔈
    <input type="range" id="volume" min="0" max="1" step="0.01" value="1">
    🔊
</div>


<div class="page-partie">
    <div class="lignePartie">
        <h1>nombre</h1>
        <h1>carte retourner</h1>
    </div>
    <br><br>
    <div class="boutton">
        <button>Plus grand</button>
        <button>Plus petit</button>
    </div>
</div>
<script>
    const musique = document.getElementById('musique');
    const volume = document.getElementById('volume');

    volume.addEventListener('input', () => {
        musique.volume = volume.value;
    });

    async function recupScore() {
        const token = localStorage.getItem('token');

        try {
            const response = await fetch('http://localhost:8080/recupScorePartie', {
                method: 'GET',
                headers: {
                    'Authorization': 'Bearer ' + token
                }
            });

            if (response.ok) {
                const score = await response.json();
                document.getElementById('score').textContent = score;
            }

        } catch (erreur) {
            console.error('Erreur récupération score :', erreur);
        }
    }

    async function lancerPartie() {
        const token = localStorage.getItem('token');

        try {
            const response = await fetch('http://localhost:8080/lancerPartie', {
                method: 'GET',
                headers: {
                    'Authorization': 'Bearer ' + token
                }
            });

            if (response.ok) {
                console.log('Partie lancée !');
                await recupScore(); // met à jour le score après le lancement
            }

        } catch (erreur) {
            console.error('Erreur lancement partie :', erreur);
        }
    }

    document.addEventListener('DOMContentLoaded', lancerPartie);
    recupScore()
</script>
</body>
</html>
