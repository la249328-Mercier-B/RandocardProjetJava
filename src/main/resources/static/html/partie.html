<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>partie Randocard</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<audio id="musique" src="../sounds/casinoLuigi.mp3" loop autoplay></audio>

<body>

<div class="player-info">
    Score : <span id="score">0</span>
</div>

<div id="coeurs" class="coeurs">
</div>

<div class="volume-control">
    🔈
    <input type="range" id="volume" min="0" max="1" step="0.01" value="1">
    🔊
</div>


<div class="page-partie">
    <div class="lignePartie">
        <h1 id="nbVisible"></h1>
        <h1>carte retourner</h1>
    </div>
    <br><br>
    <div class="boutton">
        <button id="grand">Plus grand</button>
        <button id="petit">Plus petit</button>
    </div>
</div>
<script>

    async function afficherCoeurs() {
        const nbCoeurs = await recupNbCoeurs();
        const nbCoeursMax = await recupNbCoeursMax();

        const divCoeurs = document.getElementById('coeurs');
        divCoeurs.innerHTML = '';

        for (let i = 0; i < nbCoeursMax; i++) {
            const img = document.createElement('img');
            img.src = i < nbCoeurs ? '../img/coeurVie.png' : '../img/coeurVide.png';
            divCoeurs.appendChild(img);
        }

        if (nbCoeurs === 0) {
            window.location.href = 'menuPrincipal.html';
        }
    }

    async function verifierNombre(choix) {
        const token = localStorage.getItem('token');

        try {
            const response = await fetch('http://localhost:8080/verifierNombre/' + choix, {
                method: 'GET',
                headers: {
                    'Authorization': 'Bearer ' + token
                }
            });

            if (response.ok) {
                const bonneReponse = await response.json();

                if (bonneReponse) {
                    console.log('Bonne réponse !');
                    await recupScore();
                } else {
                    console.log('Mauvaise réponse !');
                    await afficherCoeurs();
                }

                await recupNbVisible();
            }

        } catch (erreur) {
            console.error('Erreur vérification :', erreur);
        }
    }

    async function recupScore() {
        const token = localStorage.getItem('token');

        try {
            const response = await fetch('http://localhost:8080/recupScorePartie', {
                method: 'GET',
                headers: {
                    'Authorization': 'Bearer ' + token
                }
            });

            if (response.ok) {
                const score = await response.json();
                document.getElementById('score').textContent = score;
            }

        } catch (erreur) {
            console.error('Erreur récupération score :', erreur);
        }
    }

    async function recupNbVisible() {
        const token = localStorage.getItem('token');

        try {
            const response = await fetch('http://localhost:8080/recupNbVisible', {
                method: 'GET',
                headers: {
                    'Authorization': 'Bearer ' + token
                }
            });

            if (response.ok) {
                const nbVisible = await response.json();
                document.getElementById('nbVisible').textContent = nbVisible;
            }

        } catch (erreur) {
            console.error('Erreur récupération nombre visible :', erreur);
        }
    }

    async function recupNbCoeurs() {
        const token = localStorage.getItem('token');

        try {
            const response = await fetch('http://localhost:8080/recupNbCoeur', {
                method: 'GET',
                headers: {
                    'Authorization': 'Bearer ' + token
                }
            });

            if (response.ok) {
                const nbCoeurs = await response.json();
                return nbCoeurs;
            }

        } catch (erreur) {
            console.error('Erreur récupération nombre coeurs :', erreur);
        }
    }

    async function recupNbCoeursMax() {
        const token = localStorage.getItem('token');

        try {
            const response = await fetch('http://localhost:8080/recupNbCoeursMax', {
                method: 'GET',
                headers: {
                    'Authorization': 'Bearer ' + token
                }
            });

            if (response.ok) {
                const nbCoeursMax = await response.json();
                return nbCoeursMax;
            }

        } catch (erreur) {
            console.error('Erreur récupération nombre coeurs maximum :', erreur);
        }
    }

    async function lancerPartie() {
        const token = localStorage.getItem('token');

        try {
            const response = await fetch('http://localhost:8080/lancerPartie', {
                method: 'GET',
                headers: {
                    'Authorization': 'Bearer ' + token
                }
            });

            if (response.ok) {
                console.log('Partie lancée !');
                await recupScore();
                await recupNbVisible();
                await afficherCoeurs();
            }

        } catch (erreur) {
            console.error('Erreur lancement partie :', erreur);
        }
    }

    const musique = document.getElementById('musique');
    const volume = document.getElementById('volume');

    volume.addEventListener('input', () => {
        musique.volume = volume.value;
    });

    const grand = document.getElementById('grand');
    const petit = document.getElementById('petit');

    grand.addEventListener('click', function () {
        verifierNombre(true);
    })

    petit.addEventListener('click', function () {
        verifierNombre(false);
    })

    document.addEventListener('DOMContentLoaded', lancerPartie);

</script>
</body>
</html>
