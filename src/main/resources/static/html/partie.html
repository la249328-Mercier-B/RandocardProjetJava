<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>partie Randocard</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<audio id="musique" src="../sounds/casinoLuigi.mp3" loop autoplay></audio>

<body>

<div class="player-info">
    Score : <span id="score">0</span>
</div>
<div id="items-partie" class="items-partie"></div>

<div id="message-item"></div>
<div id="coeurs" class="coeurs">
</div>

<div class="volume-control">
    🔈
    <input type="range" id="volume" min="0" max="1" step="0.01" value="1">
    🔊
</div>


<div class="page-partie">
    <div class="lignePartie">
        <h1 id="nbVisible"></h1>
        <h1>carte retourner</h1>
    </div>
    <br><br>
    <div class="boutton">
        <button id="grand">Plus grand</button>
        <button id="petit">Plus petit</button>
    </div>
</div>
<script>

    var token = localStorage.getItem('token');

    async function afficherCoeurs() {
        const nbCoeurs = await recupNbCoeurs();
        const nbCoeursMax = await recupNbCoeursMax();

        const divCoeurs = document.getElementById('coeurs');
        divCoeurs.innerHTML = '';

        for (let i = 0; i < nbCoeursMax; i++) {
            const img = document.createElement('img');
            img.src = i < nbCoeurs ? '../img/coeurVie.png' : '../img/coeurVide.png';
            divCoeurs.appendChild(img);
        }

        if (nbCoeurs === 0) {
            window.location.href = 'menuPrincipal.html';
        }
    }

    async function verifierNombre(choix) {
        try {
            const response = await fetch('http://localhost:8080/verifierNombre/' + choix, {
                method: 'GET',
                headers: { 'Authorization': 'Bearer ' + token }
            });

            if (response.ok) {
                const bonneReponse = await response.json();

                if (bonneReponse) {
                    console.log('Bonne réponse !');
                    await recupScore();
                } else {
                    console.log('Mauvaise réponse !');
                    await afficherCoeurs();
                }

                await recupNbVisible();
            }

        } catch (erreur) {
            console.error('Erreur vérification :', erreur);
        }
    }

    async function recupScore() {
        try {
            const response = await fetch('http://localhost:8080/recupScorePartie', {
                method: 'GET',
                headers: { 'Authorization': 'Bearer ' + token }
            });

            if (response.ok) {
                const score = await response.json();
                document.getElementById('score').textContent = score;
            }

        } catch (erreur) {
            console.error('Erreur récupération score :', erreur);
        }
    }

    async function recupNbVisible() {
        try {
            const response = await fetch('http://localhost:8080/recupNbVisible', {
                method: 'GET',
                headers: { 'Authorization': 'Bearer ' + token }
            });

            if (response.ok) {
                const nbVisible = await response.json();
                document.getElementById('nbVisible').textContent = nbVisible;
            }

        } catch (erreur) {
            console.error('Erreur récupération nombre visible :', erreur);
        }
    }

    async function recupNbCoeurs() {
        try {
            const response = await fetch('http://localhost:8080/recupNbCoeur', {
                method: 'GET',
                headers: { 'Authorization': 'Bearer ' + token }
            });

            if (response.ok) {
                return await response.json();
            }

        } catch (erreur) {
            console.error('Erreur récupération nombre coeurs :', erreur);
        }
    }

    async function recupNbCoeursMax() {
        try {
            const response = await fetch('http://localhost:8080/recupNbCoeursMax', {
                method: 'GET',
                headers: { 'Authorization': 'Bearer ' + token }
            });

            if (response.ok) {
                return await response.json();
            }

        } catch (erreur) {
            console.error('Erreur récupération nombre coeurs maximum :', erreur);
        }
    }

    async function lancerPartie() {
        try {
            const response = await fetch('http://localhost:8080/lancerPartie', {
                method: 'GET',
                headers: { 'Authorization': 'Bearer ' + token }
            });

            if (response.ok) {
                console.log('Partie lancée !');
                await recupScore();
                await recupNbVisible();
                await afficherCoeurs();
            }

        } catch (erreur) {
            console.error('Erreur lancement partie :', erreur);
        }
    }

    // Charge les items possédés et affiche les boutons
    async function chargerMesItems() {
        try {
            var response = await fetch('http://localhost:8080/mesItems', {
                headers: { 'Authorization': 'Bearer ' + token }
            });

            if (response.ok) {
                var mesItems = await response.json();
                var div = document.getElementById('items-partie');
                div.innerHTML = '';

                mesItems.forEach(function(monItem) {
                    if (monItem.quantite > 0) {
                        var btn = document.createElement('button');
                        btn.className = 'btn-item';
                        btn.id = 'btn-' + monItem.nomItem;
                        btn.innerHTML = monItem.nomItem + '<span class="quantite">x' + monItem.quantite + '</span>';
                        btn.onclick = function() {
                            utiliserItem(monItem.nomItem);
                        };
                        div.appendChild(btn);
                    }
                });
            }

        } catch (erreur) {
            console.error('Erreur chargement items :', erreur);
        }
    }

    // Affiche un message temporaire
    function afficherMessage(texte, estErreur) {
        var msg = document.getElementById('message-item');
        msg.textContent = texte;
        msg.className = estErreur ? 'erreur' : '';
        msg.style.display = 'block';
        setTimeout(function() {
            msg.style.display = 'none';
        }, 2500);
    }

    // Utilise un item pendant la partie
    async function utiliserItem(nomItem) {
        try {
            var response = await fetch('http://localhost:8080/utiliserItem/' + nomItem, {
                method: 'POST',
                headers: { 'Authorization': 'Bearer ' + token }
            });

            var texte = await response.text();

            if (response.ok) {
                var son = new Audio('../sounds/achatSound.mp3');
                son.play();
                afficherMessage(texte, false);
                // Rafraîchit les boutons et les coeurs
                await chargerMesItems();
                await afficherCoeurs();
                await recupNbVisible();
            } else {
                afficherMessage(texte, true);
            }

        } catch (erreur) {
            console.error('Erreur utilisation item :', erreur);
        }
    }

    const musique = document.getElementById('musique');
    const volume = document.getElementById('volume');

    volume.addEventListener('input', () => {
        musique.volume = volume.value;
    });

    const grand = document.getElementById('grand');
    const petit = document.getElementById('petit');

    grand.addEventListener('click', function () {
        verifierNombre(true);
    })

    petit.addEventListener('click', function () {
        verifierNombre(false);
    })

    document.addEventListener('DOMContentLoaded', async function() {
        await lancerPartie();
        await chargerMesItems();
    });

</script>
</body>
</html>
