<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Randocard</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="player-info">
    Pseudo : <span id="pseudo-affiche">...</span>
    <br>
    Score : 0
</div>

<h1>Randocard</h1>

<div class="ligne">
    <a href="partie.html">Jouer une partie</a>

    <table>
        <tr><td colspan="2">Liste des meilleurs joueurs</td></tr>
        <tr>
            <td>Pseudo</td>
            <td>Score</td>
        </tr>
    </table>
</div>

<a href="index.html" class="retour">Retour</a>

<script>
    async function chargerNomUtilisateur() {
        const token = localStorage.getItem('token');

        if (!token) {
            window.location.href = 'index.html';
            return;
        }

        try {
            const response = await fetch('http://localhost:8080/recupNomUtilisateur', {
                method: 'GET',
                headers: {
                    'Authorization': 'Bearer ' + token
                }
            });

            console.log('Token :', localStorage.getItem('token'));

            if (response.ok) {
                const pseudo = await response.text();
                console.log('Pseudo reçu :', pseudo);  // ← ajoute ça
                document.getElementById('pseudo-affiche').textContent = pseudo;
            } else {
                console.log('Erreur HTTP :', response.status);  // ← et ça
                window.location.href = 'index.html';
            }


        } catch (erreur) {
            console.error('Erreur réseau :', erreur);
        }
    }

    chargerNomUtilisateur();
</script>
    
</body>
</html>
