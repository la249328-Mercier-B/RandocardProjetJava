<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Randocard</title>
    <link rel="stylesheet" href="../css/style.css">
</head>



<body>

<div class="player-info">
    Pseudo : <span id="pseudo-affiche">...</span>
    <br>
    Piéces : <span id="piece-affiche">...</span>
    <br>
    Meilleur score : <span id="score-affiche">...</span>
</div>

<h1>Randocard</h1>

<div class="ligne">
    <a href="partie.html">Jouer une partie</a>

    <table>
        <tr class="titre-tableau"><td colspan="2">Liste des 5 meilleurs joueurs</td></tr>
        <tr>
            <th>Pseudo</th>
            <th>Score</th>
        </tr>
        <tbody id="tableau-scores"></tbody>
    </table>
</div>

<a href="index.html" class="retour">Retour</a>

<script>
    async function chargerNomUtilisateur() {
        const token = localStorage.getItem('token');

        if (!token) {
            window.location.href = 'index.html';
            return;
        }

        try {
            const response = await fetch('http://localhost:8080/recupNomUtilisateur', {
                method: 'GET',
                headers: {
                    'Authorization': 'Bearer ' + token
                }
            });

            console.log('Token :', localStorage.getItem('token'));

            if (response.ok) {
                const pseudo = await response.text();
                console.log('Pseudo reçu :', pseudo);
                document.getElementById('pseudo-affiche').textContent = pseudo;
            } else {
                console.log('Erreur HTTP :', response.status);
                window.location.href = 'index.html';
            }


        } catch (erreur) {
            console.error('Erreur réseau :', erreur);
        }
    }

    async function chargerPieceUtilisateur() {
        const token = localStorage.getItem('token');

        if (!token) {
            window.location.href = 'index.html';
            return;
        }

        try {
            const response = await fetch('http://localhost:8080/recupPieceUtilisateur', {
                method: 'GET',
                headers: {
                    'Authorization': 'Bearer ' + token
                }
            });

            console.log('Token :', localStorage.getItem('token'));

            if (response.ok) {
                const piece = await response.text();
                console.log('Piece reçu :', piece);
                document.getElementById('piece-affiche').textContent = piece;
            } else {
                console.log('Erreur HTTP :', response.status);
                window.location.href = 'index.html';
            }


        } catch (erreur) {
            console.error('Erreur réseau :', erreur);
        }
    }

    async function chargerScoreUtilisateur() {
        const token = localStorage.getItem('token');

        if (!token) {
            window.location.href = 'index.html';
            return;
        }

        try {
            const response = await fetch('http://localhost:8080/recupScoreUtilisateur', {
                method: 'GET',
                headers: {
                    'Authorization': 'Bearer ' + token
                }
            });

            console.log('Token :', localStorage.getItem('token'));

            if (response.ok) {
                const score = await response.text();
                console.log('Score reçu :', score);
                document.getElementById('score-affiche').textContent = score;
            } else {
                console.log('Erreur HTTP :', response.status);
                window.location.href = 'index.html';
            }


        } catch (erreur) {
            console.error('Erreur réseau :', erreur);
        }
    }

    async function charger5MeilleursScore() {
        const token = localStorage.getItem('token');

        if (!token) {
            window.location.href = 'index.html';
            return;
        }

        try {
            const response = await fetch('http://localhost:8080/recup5MeilleursScore', {
                method: 'GET',
                headers: {
                    'Authorization': 'Bearer ' + token
                }
            });

            console.log('Token :', localStorage.getItem('token'));

            if (response.ok) {
                const utilisateurs = await response.json();
                const tbody = document.getElementById('tableau-scores');

                utilisateurs.forEach(u => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `<td>${u.pseudo}</td><td>${u.score}</td>`;
                    tbody.appendChild(tr);
                });
            } else {
                console.log('Erreur HTTP :', response.status);
                window.location.href = 'index.html';
            }


        } catch (erreur) {
            console.error('Erreur réseau :', erreur);
        }
    }

    chargerNomUtilisateur();
    chargerPieceUtilisateur();
    chargerScoreUtilisateur();
    charger5MeilleursScore();
</script>
    
</body>
</html>
