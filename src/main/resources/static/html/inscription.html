<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription Randocard</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/appelRequete.js"></script>
</head>
<body>
<center>
    <h1 class="titre">Inscription</h1>

    <div class="ligne-colonne">
        <div class="font">
            <label for="pseudo">Pseudo: </label>
            <input type="text" id="pseudo">

            <br><br>

            <label for="motdepasse">Mot de passe: </label>
            <input type="password" id="motdepasse">

            <br><br>

            <label for="confirmation">Confirmer le mot de passe: </label>
            <input type="password" id="confirmation">

            <br><br>

            <button onclick="sInscrire()">S'inscrire</button>

            <p id="message-erreur" style="color: red; display: none;"></p>
            <p id="message-succes" style="color: green; display: none;"></p>
        </div>
    </div>

    <a href="index.html" class="retour">Retour</a>
</center>
</body>
</html>
